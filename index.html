<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="dark">
<title>APT Championship Taipei 2026</title>
<style>
  :root{
    color-scheme: dark;
    --bg: #0B0F17;
    --card: #141B27;
    --card-border: #232C3B;
    --ink: #FBFAF7;
    --ink-dim: #B6BDCC;
    --ink-faint: #8891A3;
    --blue: #5B9BF0;
    --red: #FF5A67;
    --gold: #E3BE7C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  button{
    -webkit-appearance:none;
    appearance:none;
    font-family:inherit;
  }
  html,body{margin:0;padding:0;min-height:100%;background-color:#0B0F17 !important;color:#FBFAF7 !important;
    font-family:-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif; -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;}

  .wrap{max-width:640px;margin:0 auto;padding:0 0 56px;background-color:#0B0F17;min-height:100vh;}

  header{
    padding:26px 20px 18px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(120% 140% at 15% -10%, rgba(91,155,240,0.20), transparent 55%),
      radial-gradient(120% 140% at 85% -10%, rgba(255,90,103,0.20), transparent 55%),
      var(--bg);
    border-bottom:1px solid var(--card-border);
  }
  .eyebrow{
    font-family:'SF Mono','Courier New',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 8px;
  }
  h1{
    font-family:Georgia,'Hiragino Mincho ProN','Yu Mincho',serif;
    font-weight:600;
    font-size:26px;
    line-height:1.18;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:13px;
    color:var(--ink-dim);
    margin:0 0 16px;
  }
  .legend{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'SF Mono','Courier New',monospace;
    font-size:10px;
    color:var(--ink-faint);
    margin-bottom:4px;
  }
  .legend-bar{
    flex:1;
    height:6px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--blue), #BE96E6 50%, var(--red));
  }
  .count{
    font-family:'SF Mono','Courier New',monospace;
    font-size:11px;
    color:var(--ink-faint);
    margin-top:10px;
  }
  .count b{color:var(--ink);}

  .currency-toggle{
    display:inline-flex;
    margin-top:14px;
    border:1px solid var(--card-border);
    border-radius:100px;
    background:var(--card);
    padding:3px;
    gap:2px;
    cursor:pointer;
  }
  .cur-opt{
    font-family:'SF Mono','Courier New',monospace;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.04em;
    padding:6px 16px;
    border-radius:100px;
    color:var(--ink-faint);
    transition:background .15s ease, color .15s ease;
  }
  .cur-opt.active{
    background:linear-gradient(90deg, var(--blue), #BE96E6);
    color:#0B0F17;
  }

  .view-toggle{
    display:flex;
    gap:6px;
    padding:12px 20px 0;
  }
  .view-btn{
    flex:1;
    font-family:'SF Mono','Courier New',monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--card);
    color:var(--ink-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .view-btn.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }
  .view-btn svg{width:14px;height:14px;}

  .filter-group{padding:12px 20px 0;}
  .filter-label{
    font-family:'SF Mono','Courier New',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 7px 2px;
  }
  .filters{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:4px;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip-btn{
    flex:none;
    font-family:'SF Mono','Courier New',monospace;
    font-size:11px;
    letter-spacing:.03em;
    padding:7px 13px;
    border-radius:100px;
    border:1px solid var(--card-border);
    background:var(--card);
    color:var(--ink-dim);
    font-weight:500;
  }
  .chip-btn.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }

  .list{padding:6px 14px 0;}
  .day-head{
    font-family:'SF Mono','Courier New',monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--gold);
    padding:18px 6px 6px;
    border-top:1px solid var(--card-border);
    margin-top:4px;
  }
  .list > .day-head:first-child{border-top:none; margin-top:0;}

  .row{border-bottom:1px solid var(--card-border);}
  .row-head{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 6px;
    cursor:pointer;
    user-select:none;
  }
  .num{
    font-family:'SF Mono','Courier New',monospace;
    font-size:11.5px;
    color:var(--ink-faint);
    width:38px;
    flex:none;
  }
  .fee-dot{
    width:9px;height:9px;border-radius:50%;
    flex:none;
    box-shadow:0 0 9px 1px var(--dotcolor,transparent);
  }
  .row-main{flex:1; min-width:0;}
  .row-title{
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    line-height:1.35;
  }
  .tag{
    font-family:'SF Mono','Courier New',monospace;
    font-size:9px;
    letter-spacing:.04em;
    padding:2px 5px;
    border-radius:4px;
    border:1px solid currentColor;
    opacity:.9;
    flex:none;
  }
  .tag.NLH{color:#86BBFF;}
  .tag.PLO{color:#F2C15C;}
  .tag.MIX{color:#C3A8FF;}
  .tag.OTHER{color:#7FE0C0;}
  .tag.MULTI{
    color:var(--red);
    border-color:var(--red);
    background:rgba(255,90,103,0.10);
    font-weight:700;
  }
  .tag.LADIES{
    color:#F26FA3;
    border-color:#F26FA3;
    background:rgba(242,111,163,0.10);
    font-weight:700;
  }
  .tag.BOUNTY{
    color:#52E0AA;
    border-color:#52E0AA;
    background:rgba(82,224,170,0.10);
  }
  .tag.SAT{
    color:#FFB84D;
    border-color:#FFB84D;
    background:rgba(255,184,77,0.10);
  }
  .tag.HU{
    color:#E0A352;
    border-color:#E0A352;
  }
  .row.multi-day{
    border-left:2px solid var(--red);
    background:rgba(255,90,103,0.045);
  }
  .row.multi-day .row-head{padding-left:4px;}
  .row-sub{
    font-size:11.5px;
    font-weight:500;
    color:var(--ink-dim);
    margin-top:2px;
  }
  .fee{
    font-family:'SF Mono','Courier New',monospace;
    font-weight:700;
    font-size:13.5px;
    flex:none;
    text-align:right;
    min-width:84px;
  }
  .fee small{font-size:9px;font-weight:400;color:var(--ink-faint);display:block;text-align:right;margin-top:1px;}

  .chevron{
    flex:none;
    width:15px;height:15px;
    color:var(--ink-faint);
    transition:transform .25s ease;
  }
  .row.open .chevron{transform:rotate(180deg);}

  .star-btn{
    flex:none;
    width:30px;height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
  }
  .star-btn svg{
    width:18px;height:18px;
    color:var(--ink-faint);
    transition:transform .15s ease, color .15s ease;
  }
  .star-btn.fav svg{
    color:var(--gold);
    fill:var(--gold);
    transform:scale(1.08);
  }
  .star-btn:active svg{transform:scale(0.85);}

  .detail{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .row.open .detail{max-height:600px;}
  .detail-inner{
    padding:2px 6px 16px 55px;
    font-size:13px;
    color:var(--ink-dim);
    line-height:1.75;
  }
  .detail-grid{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:4px 12px;
    margin-top:4px;
  }
  .detail-grid dt{
    font-family:'SF Mono','Courier New',monospace;
    font-size:10px;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .detail-grid dd{margin:0; color:var(--ink); font-weight:500;}
  .flight-line{
    color:var(--ink);
    font-weight:500;
    padding:2px 0;
  }
  .flight-line + .flight-line{
    border-top:1px dashed var(--card-border);
  }

  .empty{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-faint);
    font-size:13px;
  }

  footer{
    padding:24px 20px 0;
    text-align:center;
    font-family:'SF Mono','Courier New',monospace;
    font-size:10px;
    color:var(--ink-faint);
    letter-spacing:.03em;
    line-height:1.8;
  }
</style>
</head>

<div class="wrap">

    <div class="legend">
      <span>安い</span>
      <div class="legend-bar"></div>
      <span>高い</span>
    </div>
    <button class="currency-toggle" id="currencyToggle">
      <span class="cur-opt" data-cur="TWD">TWD</span>
      <span class="cur-opt" data-cur="JPY">JPY</span>

    <div class="count" id="count"></div>
  </header>

  <div class="view-toggle">
    <button class="view-btn active" id="viewAllBtn">全イベント</button>
    <button class="view-btn" id="viewFavBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      お気に入り <span id="favCount"></span>
    </button>
  </div>

  <div class="filter-group">
    <p class="filter-label">ゲーム種別</p>
    <div class="filters" id="filtersType"></div>
  </div>
  <div class="filter-group">
    <p class="filter-label">フィー帯</p>
    <div class="filters" id="filtersTier"></div>
  </div>
  <div class="filter-group">
    <p class="filter-label">開催日数</p>
    <div class="filters" id="filtersDuration"></div>

  <div class="list" id="list"></div>
  <footer>Buy-in は TWD 表記／括弧内は概算 JPY（1 TWD ≒ 5.0 JPY）<br>時刻は台北現地時間</footer>
</div>

const sideEvents = [];
Object.keys(sideRaw).forEach(day=>{
  sideRaw[day].forEach(([id,name,fee,start,regClose,extra])=>{
    sideEvents.push({id, day, name, fee, start, regClose, champ:false, ...(extra||{})});
  });
});

const allEvents = [...champEvents, ...sideEvents].sort((a,b)=>{
  const da = a.day.split('/').map(Number), db = b.day.split('/').map(Number);
  if(da[1]!==db[1]) return da[1]-db[1];
  if(a.champ !== b.champ) return a.champ ? -1 : 1;
  const na = parseInt((a.id.match(/\d+/)||[0])[0]);
  const nb = parseInt((b.id.match(/\d+/)||[0])[0]);
  return na-nb;
});

// ── type classification & attributes ──
function classify(name){
  const n = name.toLowerCase();
  if(/mind sports/.test(n)) return 'OTHER';
  if(/omaha|courchevel|drawmaha|big o/.test(n)) return 'PLO';
  if(/fixed limit|dealer's choice|triple draw|stud|badugi|r-o-s-e-t|razz|8-game|9-game|mix|big bet|draw poker/.test(n)) return 'MIX';
  return 'NLH';
}

allEvents.forEach(e => {
  e.type = classify(e.name);
  e.key = e.id + '|' + e.day;
  
  const n = e.name.toLowerCase();
  e.bounty = /bounty/i.test(n);
  e.hu = /heads up/i.test(n);
  e.ladies = /women'?s/i.test(n);
  e.sat = e.sat || /satellite/i.test(n);
  
  const hasDayRange = e.days && /–/.test(e.days);
  const hasDayLabelInName = /\(Day\s*1\)/i.test(e.name);
  e.multiDay = !!(hasDayRange || hasDayLabelInName || (e.flights && e.flights.length > 0));
});

// ── fee tier ──
function tierOf(fee){
  if(fee<=15000) return 'MIN';
  if(fee<=50000) return 'MID';
  if(fee<=150000) return 'HR';
  return 'SHR';
}
allEvents.forEach(e=> e.tier = tierOf(e.fee));

const tierLabel = {MIN:'ミニマム (~15K)', MID:'ミドル (15K–50K)', HR:'ハイローラー (50K–150K)', SHR:'スーパーHR (150K~)'};

const fees = allEvents.map(e=>e.fee);
const minLog = Math.log(Math.min(...fees));
const maxLog = Math.log(Math.max(...fees));

function feeColor(fee){
  const t = (Math.log(fee)-minLog)/(maxLog-minLog);
  const blue=[91,155,240], red=[255,90,103], mid=[190,150,230];
  let c1,c2,localT;
  if(t<0.5){c1=blue;c2=mid;localT=t/0.5;}
  else{c1=mid;c2=red;localT=(t-0.5)/0.5;}
  const rgb = c1.map((v,i)=>Math.round(v+(c2[i]-v)*localT));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

function fmt(n){ return Math.round(n).toLocaleString('en-US'); }

// ── ブラインドストラクチャー推定 ──
function estimateStructure(e){
  const n = e.name.toLowerCase();
  if(/super hyper turbo/.test(n)) return {before:5, after:5, desc:"超高速 5分ブラインド"};
  if(/hyper turbo/.test(n)) return {before:10, after:8, desc:"高速 8~10分ブラインド"};
  if(/turbo/.test(n)) return {before:15, after:12, desc:"ターボ 12~15分ブラインド"};
  if(e.champ && e.multiDay) return {before:40, after:40, desc:"ロングストラクチャー 30~40分ブラインド"};
  if(e.champ || e.fee >= 100000) return {before:30, after:25, desc:"スタンダード 25~30分ブラインド"};
  if(/single day|towering|super stack/i.test(n)) return {before:25, after:20, desc:"ディープ 20~25分ブラインド"};
  return {before:20, after:15, desc:"通常 15~20分ブラインド"};
}

function expandDayRange(str){
  const m = str.match(/^(\d+)\/(\d+)–(\d+)$/);
  if(!m) return [str];
  const month = m[1], startDay = parseInt(m[2],10), endDay = parseInt(m[3],10);
  const out = [];
  for(let d=startDay; d<=endDay; d++) out.push(`${month}/${d}`);
  return out;
}

  try{

function render(){
  listEl.innerHTML = '';

  if(!favLoaded){
    listEl.innerHTML = '<div class="empty">読み込み中…</div>';
    return;
  }

  let source = allEvents;
  if(viewMode === 'FAV'){
    source = allEvents.filter(e=>favorites.has(e.key));
  }

  const filtered = source.filter(e=>
    (selectedTypes.size===0 || selectedTypes.has(e.type)) &&
    (selectedTiers.size===0 || selectedTiers.has(e.tier)) &&
    (selectedDurations.size===0 || selectedDurations.has(e.multiDay ? 'MULTI' : 'SINGLE'))
  );

  countEl.innerHTML = viewMode==='FAV'
    ? `<b>${filtered.length}</b> 件のお気に入り`

    listEl.innerHTML = viewMode==='FAV'

            <dt>ブラインド</dt><dd>${structure.desc}</dd>
            ${e.note ? `<dt>メモ</dt><dd>${e.note}</dd>` : ''}
          </dl>
        </div>
      </div>
    `;
    const head = row.querySelector('.row-head');
    head.addEventListener('click', (ev)=>{
      if(ev.target.closest('.star-btn')) return;
      const wasOpen = row.classList.contains('open');
      document.querySelectorAll('.row.open').forEach(r=>r.classList.remove('open'));
      if(!wasOpen) row.classList.add('open');
    });
    row.querySelector('.star-btn').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      toggleFavorite(e.key);
    });
    listEl.appendChild(row);
  });
}

function makeMultiFilterRow(container, options, selectedSet){
  container.innerHTML = '';
  const [allVal, allLabel] = options[0];
  options.forEach(([val,label])=>{
    const btn = document.createElement('button');
    btn.className = 'chip-btn';
    btn.textContent = label;
    btn.dataset.val = val;
    container.appendChild(btn);
    btn.addEventListener('click', ()=>{
      if(val === allVal){
        selectedSet.clear();
      }else{
        if(selectedSet.has(val)) selectedSet.delete(val);
        else selectedSet.add(val);
      }
      refreshChips();
      render();
    });
  });
  function refreshChips(){
    container.querySelectorAll('.chip-btn').forEach(btn=>{
      const v = btn.dataset.val;
      const isActive = v === allVal ? selectedSet.size===0 : selectedSet.has(v);
      btn.classList.toggle('active', isActive);
    });
  }
  refreshChips();
}

makeMultiFilterRow(filtersTypeEl,
  [['ALL','すべて'],['NLH','NLH'],['PLO','PLO'],['MIX','MIX'],['OTHER','その他']],
  selectedTypes);

makeMultiFilterRow(filtersTierEl,
  [['ALL','すべて'],['MIN','MIN ~15K'],['MID','MID 15–50K'],['HR','HR 50–150K'],['SHR','SHR 150K~']],
  selectedTiers);

favLoaded = true;
render();
loadFavorites();
</script>
