<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APT Championship Taipei 2026 Schedule</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding-bottom: 30px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
    }

    h1 { font-size: 1.1rem; color: #fff; font-weight: 700; margin-bottom: 8px; text-align: center; }

    .filter-group {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
      font-weight: bold;
    }

    .container { padding: 12px; max-width: 600px; margin: 0 auto; }

    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .card-header {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      cursor: pointer;
    }
    .event-title-area { flex: 1; padding-right: 8px; }
    .event-number { font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; margin-bottom: 2px; }
    .event-name { font-size: 0.95rem; font-weight: 600; line-height: 1.3; color: #fff; }

    /* 表側の表示項目（円換算・フィー帯をカット、レイト時間を追加） */
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .meta-item { display: flex; align-items: center; gap: 4px; }
    .meta-item strong { color: var(--text-main); }
    .buyin-badge { color: #4ade80; font-weight: bold; }

    .fav-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: #475569;
      cursor: pointer;
      padding: 0 4px;
    }
    .fav-btn.active { color: var(--accent-gold); }

    /* 詳細タブ（▼）を開いた時の表示項目 */
    .card-details {
      display: none;
      padding: 12px;
      background: #0f172a;
      border-top: 1px solid var(--border-color);
      font-size: 0.82rem;
    }
    .card-details.open { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .detail-box {
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
    }
    .detail-label { color: var(--text-muted); font-size: 0.7rem; margin-bottom: 2px; }
    .detail-val { font-weight: 600; color: #f1f5f9; }

    .notes {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<header>
  <h1>APT Championship Taipei 2026</h1>
  <div class="filter-group" id="dateFilter">
    <button class="filter-btn active" data-date="all">すべて</button>
    <button class="filter-btn" data-date="fav">お気に入り★</button>
  </div>
</header>

<div class="container" id="eventList"></div>

<script>
// ★ここにお手元の全イベントデータ (const events = [...]) を配置してください
const events = [
  /* お手元の188イベントデータをそのまま残します */
];

let favorites = JSON.parse(localStorage.getItem('apt_favs') || '[]');
let currentFilter = 'all';

function renderEvents() {
  const container = document.getElementById('eventList');
  container.innerHTML = '';

  const filtered = events.filter(e => {
    if (currentFilter === 'fav') return favorites.includes(e.id || e.num);
    if (currentFilter !== 'all') return e.date === currentFilter;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">該当するイベントがありません</div>';
    return;
  }

  filtered.forEach(e => {
    const eventId = e.id || e.num;
    const isFav = favorites.includes(eventId);
    const card = document.createElement('div');
    card.className = 'event-card';

    // スタックとレイト時BBのテキスト整形
    const stackText = e.stack ? e.stack : (e.startingStack || '-');
    const lateBBText = e.lateBB ? ` (レイト時${e.lateBB})` : '';

    card.innerHTML = `
      <div class="card-header" onclick="toggleDetail('${eventId}')">
        <div class="event-title-area">
          <div class="event-number">${e.num || ''}</div>
          <div class="event-name">${e.name}</div>
          <div class="card-meta">
            <span class="buyin-badge">${e.buyin || ''}</span>
            <span class="meta-item">開始: <strong>${e.startTime || e.time || '-'}</strong></span>
            <span class="meta-item" style="color:#ef4444;">レイト: <strong>${e.regClose || e.lateReg || '-'}</strong></span>
          </div>
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${eventId}')">
          ${isFav ? '★' : '☆'}
        </button>
      </div>

      <div class="card-details" id="detail-${eventId}">
        <div class="detail-grid">
          <div class="detail-box">
            <div class="detail-label">Starting Stack</div>
            <div class="detail-val">${stackText}<span style="font-size:0.7rem; color:#f59e0b;">${lateBBText}</span></div>
          </div>
          <div class="detail-box">
            <div class="detail-label">ブラインド時間</div>
            <div class="detail-val">${e.levelDur || e.blindTime || '-'}</div>
          </div>
        </div>
        ${e.gtd ? `<div class="notes" style="color:#4ade80; font-weight:bold; margin-bottom:6px;">GTD: ${e.gtd}</div>` : ''}
        ${e.structure ? `<div class="notes"><strong>進行構造:</strong><br>${e.structure}</div>` : ''}
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleDetail(id) {
  const el = document.getElementById(`detail-${id}`);
  if (el) el.classList.toggle('open');
}

function toggleFav(event, id) {
  event.stopPropagation();
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
  } else {
    favorites.push(id);
  }
  localStorage.setItem('apt_favs', JSON.stringify(favorites));
  renderEvents();
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.date;
    renderEvents();
  });
});

renderEvents();
</script>
</body>
</html>
