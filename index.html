<!DOCTYPE html>
<html lang="ja">
<head>

<title>APT Championship Taipei 2026</title>
<style>
  :root{
    color-scheme: dark;
    --bg: #0B0F17;
    --card: #141B27;
    --card-border: #232C3B;
    --ink: #FBFAF7;
    --ink-dim: #B6BDCC;
    --ink-faint: #8891A3;
    --blue: #5B9BF0;
    --red: #FF5A67;
    --gold: #E3BE7C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  button{
    -webkit-appearance:none;
    appearance:none;
    font-family:inherit;
  }
  html,body{margin:0;padding:0;min-height:100%;background-color:#0B0F17 !important;color:#FBFAF7 !important;
    font-family:-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif; -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;}

  .wrap{max-width:640px;margin:0 auto;padding:0 0 56px;background-color:#0B0F17;min-height:100vh;}

  header{
    padding:26px 20px 18px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(120% 140% at 15% -10%, rgba(91,155,240,0.20), transparent 55%),
      radial-gradient(120% 140% at 85% -10%, rgba(255,90,103,0.20), transparent 55%),
      var(--bg);
    border-bottom:1px solid var(--card-border);
  }
  .eyebrow{
    font-family:'SF Mono','Courier New',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 8px;
  }
  h1{
    font-family:Georgia,'Hiragino Mincho ProN','Yu Mincho',serif;
    font-weight:600;
    font-size:26px;
    line-height:1.18;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:13px;
    color:var(--ink-dim);

  }
  .legend{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'SF Mono','Courier New',monospace;
    font-size:10px;
    color:var(--ink-faint);
    margin-bottom:4px;
  }
  .legend-bar{
    flex:1;
    height:6px;
    border-radius:3px;

  }
  .count{
    font-family:'SF Mono','Courier New',monospace;

    margin-top:10px;
  }

    display:inline-flex;

    padding:3px;

  }

    font-weight:700;

    color:var(--ink-faint);

  }
  .cur-opt.active{
    background:linear-gradient(90deg, var(--blue), #BE96E6);

  }

  .view-toggle{
    display:flex;

  .view-btn{

    font-weight:600;
    letter-spacing:.03em;

    color:var(--ink-dim);

    align-items:center;

  }

  }

    font-size:9.5px;

// 重複判定してユニーク化（同日・同名・同時刻の重複のみ除去）
const uniqueMap = new Map();
rawDataList.forEach(e => {
  const uniqKey = `${e.day}_${e.name}_${e.start}`;
  if(!uniqueMap.has(uniqKey)){
    uniqueMap.set(uniqKey, e);
  }
});

const allEvents = Array.from(uniqueMap.values()).sort((a,b)=>{
  const da = a.day.split('/').map(Number), db = b.day.split('/').map(Number);
  if(da[1]!==db[1]) return da[1]-db[1];
  if(a.champ !== b.champ) return a.champ ? -1 : 1;
  const na = parseInt((a.id.match(/\d+/)||[0])[0]);
  const nb = parseInt((b.id.match(/\d+/)||[0])[0]);
  if(na !== nb) return na - nb;
  return a.start.localeCompare(b.start);
});

// ── type classification & attributes ──
function classify(name){
  const n = name.toLowerCase();
  if(/mind sports/.test(n)) return 'OTHER';
  if(/omaha|courchevel|drawmaha|big o/.test(n)) return 'PLO';
  if(/fixed limit|dealer's choice|triple draw|stud|badugi|r-o-s-e-t|razz|8-game|9-game|mix|big bet|draw poker|pineapple/.test(n)) return 'MIX';
  return 'NLH';
}

allEvents.forEach(e => {
  e.type = classify(e.name);
  e.key = e.id + '|' + e.day + '|' + e.name;
  
  const n = e.name.toLowerCase();
  e.bounty = /bounty/i.test(n);
  e.hu = /heads up/i.test(n);
  e.ladies = /women'?s/i.test(n);
  
  const hasDayRange = e.days && /–/.test(e.days);
  const hasDayLabelInName = /\(Day\s*\d+\)/i.test(e.name);
  e.multiDay = !!(hasDayRange || hasDayLabelInName);
});

// ── fee tier ──
function tierOf(fee){
  if(fee<=15000) return 'MIN';
  if(fee<=50000) return 'MID';
  if(fee<=150000) return 'HR';
  return 'SHR';
}
allEvents.forEach(e=> e.tier = tierOf(e.fee));

const tierLabel = {MIN:'ミニマム (~15K)', MID:'ミドル (15K–50K)', HR:'ハイローラー (50K–150K)', SHR:'スーパーHR (150K~)'};

const fees = allEvents.map(e=>e.fee).filter(f => f > 0);
const minLog = Math.log(Math.min(...fees) || 3500);
const maxLog = Math.log(Math.max(...fees) || 1000000);

function feeColor(fee){
  if(fee === 0) return 'rgb(186, 193, 207)';
  const t = (Math.log(fee)-minLog)/(maxLog-minLog);
  const blue=[91,155,240], red=[255,90,103], mid=[190,150,230];
  let c1,c2,localT;
  if(t<0.5){c1=blue;c2=mid;localT=t/0.5;}
  else{c1=mid;c2=red;localT=(t-0.5)/0.5;}
  const rgb = c1.map((v,i)=>Math.round(v+(c2[i]-v)*localT));
  return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
}

function fmt(n){ return Math.round(n).toLocaleString('en-US'); }

// ── ブラインドストラクチャー推定 ──
function estimateStructure(e){
  if(e.lvl) return {desc: e.lvl + " ブラインド"};
  const n = e.name.toLowerCase();
  if(/super hyper turbo/.test(n)) return {desc:"超高速 5分ブラインド"};
  if(/hyper turbo/.test(n)) return {desc:"高速 8~10分ブラインド"};
  if(/turbo/.test(n)) return {desc:"ターボ 12~15分ブラインド"};
  if(e.champ && e.multiDay) return {desc:"ロングストラクチャー 40分ブラインド"};
  if(e.champ || e.fee >= 100000) return {desc:"スタンダード 25~30分ブラインド"};
  if(/single day|towering|super stack/i.test(n)) return {desc:"ディープ 20~25分ブラインド"};
  return {desc:"通常 15~20分ブラインド"};
}

function expandDayRange(str){
  const m = str.match(/^(\d+)\/(\d+)–(\d+)$/);
  if(!m) return [str];
  const month = m[1], startDay = parseInt(m[2],10), endDay = parseInt(m[3],10);
  const out = [];
  for(let d=startDay; d<=endDay; d++) out.push(`${month}/${d}`);
  return out;
}

const listEl = document.getElementById('list');
const filtersTypeEl = document.getElementById('filtersType');
const filtersTierEl = document.getElementById('filtersTier');
const filtersDurationEl = document.getElementById('filtersDuration');
const countEl = document.getElementById('count');
const viewAllBtn = document.getElementById('viewAllBtn');
const viewFavBtn = document.getElementById('viewFavBtn');
const favCountEl = document.getElementById('favCount');

let selectedTypes = new Set();
let selectedTiers = new Set();
let selectedDurations = new Set();
let viewMode = 'ALL';
let currency = 'TWD';
let favorites = new Set();
let favLoaded = false;

const currencyToggle = document.getElementById('currencyToggle');
function updateCurrencyUI(){
  currencyToggle.querySelectorAll('.cur-opt').forEach(el=>{
    el.classList.toggle('active', el.dataset.cur === currency);
  });
}
currencyToggle.addEventListener('click', ()=>{
  currency = currency === 'TWD' ? 'JPY' : 'TWD';
  updateCurrencyUI();
  render();
});
updateCurrencyUI();

const STAR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>';

function loadFavorites(){
  try{
    const raw = localStorage.getItem('apt-taipei-2026:favorites');
    if(raw){
      favorites = new Set(JSON.parse(raw));
    }
  }catch(err){
    favorites = new Set();
  }
  favLoaded = true;
  updateFavCount();
  render();
}

function saveFavorites(){
  try{
    localStorage.setItem('apt-taipei-2026:favorites', JSON.stringify([...favorites]));
  }catch(err){
    console.error('お気に入りの保存に失敗しました', err);
  }
}

function updateFavCount(){
  favCountEl.textContent = favorites.size > 0 ? `(${favorites.size})` : '';
}

function toggleFavorite(key){
  if(favorites.has(key)) favorites.delete(key);
  else favorites.add(key);
  updateFavCount();
  saveFavorites();
  render();
}

viewAllBtn.addEventListener('click', ()=>{
  viewMode = 'ALL';
  viewAllBtn.classList.add('active');
  viewFavBtn.classList.remove('active');
  render();
});
viewFavBtn.addEventListener('click', ()=>{
  viewMode = 'FAV';
  viewFavBtn.classList.add('active');
  viewAllBtn.classList.remove('active');
  render();
});

function render(){
  listEl.innerHTML = '';

  if(!favLoaded){
    listEl.innerHTML = '<div class="empty">読み込み中…</div>';
    return;
  }

  let source = allEvents;
  if(viewMode === 'FAV'){
    source = allEvents.filter(e=>favorites.has(e.key));
  }

  const filtered = source.filter(e=>
    (selectedTypes.size===0 || selectedTypes.has(e.type)) &&
    (selectedTiers.size===0 || selectedTiers.has(e.tier)) &&
    (selectedDurations.size===0 || selectedDurations.has(e.multiDay ? 'MULTI' : 'SINGLE'))
  );

  countEl.innerHTML = viewMode==='FAV'
    ? `<b>${filtered.length}</b> 件のお気に入り`
    : `<b>${filtered.length}</b> / ${allEvents.length} イベント表示中`;

  if(filtered.length===0){
    listEl.innerHTML = viewMode==='FAV'
      ? '<div class="empty">★ボタンをタップしてお気に入りに追加しよう</div>'
      : '<div class="empty">該当するイベントがありません</div>';
    return;
  }

  let lastDay = null;
  filtered.forEach(e=>{
    if(e.day !== lastDay){
      const h = document.createElement('div');
      h.className = 'day-head';
      h.textContent = e.day;
      listEl.appendChild(h);
      lastDay = e.day;
    }
    const row = document.createElement('div');
    row.className = 'row' + (e.multiDay ? ' multi-day' : '');
    const color = feeColor(e.fee);
    const jpy = fmt(e.fee * RATE);
    const twd = fmt(e.fee);
    
    let mainAmount = currency === 'TWD' ? `TWD ${twd}` : `¥${jpy}`;
    let subAmount = currency === 'TWD' ? `≈¥${jpy}` : `≈TWD ${twd}`;
    if(e.fee === 0){
      mainAmount = "Pass";
      subAmount = "通過者のみ";
    }

    const isFav = favorites.has(e.key);
    const structure = estimateStructure(e);
    const dayList = e.multiDay && e.days ? expandDayRange(e.days) : null;
    const dayListHtml = dayList
      ? dayList.map((d,i)=>`<div class="flight-line">Day ${i+1}（${d}）${i===0 ? ' ・ この日にエントリー開始' : ''}</div>`).join('')
      : `<div class="flight-line">${e.days || e.day}</div>`;
      
    const multiTag = e.multiDay ? '<span class="tag MULTI">2Days+</span>' : '';
    const ladiesTag = e.ladies ? '<span class="tag LADIES">Ladies</span>' : '';
    const bountyTag = e.bounty ? '<span class="tag BOUNTY">Bounty</span>' : '';
    const huTag = e.hu ? '<span class="tag HU">Heads Up</span>' : '';

    row.innerHTML = `
      <div class="row-head" style="--dotcolor:${color}">
        <span class="num">${e.id}</span>
        <span class="fee-dot" style="background:${color}"></span>
        <div class="row-main">
          <div class="row-title">${e.name} <span class="tag ${e.type}">${e.type}</span>${multiTag}${ladiesTag}${bountyTag}${huTag}</div>
          <div class="row-sub">${e.start ? '⏱ '+e.start+' start' : ''}${e.champ ? ' · メインシリーズ' : ''}${e.gtd ? ' · GTD '+e.gtd : ''}</div>
        </div>
        <div class="fee" style="color:${color}">${mainAmount}<small>${subAmount}</small></div>
        <button class="star-btn${isFav ? ' fav':''}" aria-label="お気に入り">${STAR_ICON}</button>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <div class="detail">
        <div class="detail-inner">
          <dl class="detail-grid">
            <dt>日程</dt><dd>${dayListHtml}</dd>
            ${e.start ? `<dt>スタート</dt><dd>${e.start}</dd>` : ''}
            ${e.regClose ? `<dt>レイトレジ締切</dt><dd>${e.regClose}${e.regClose < e.start ? '（翌日）' : ''}</dd>` : ''}
            ${e.lateLvl ? `<dt>レイト時ブラインド</dt><dd>${e.lateLvl}</dd>` : ''}
            ${e.stack ? `<dt>初期スタック</dt><dd>${e.stack}</dd>` : ''}
            ${e.itm ? `<dt>ITM率</dt><dd>${e.itm}</dd>` : ''}
            <dt>フィー帯</dt><dd>${tierLabel[e.tier]}</dd>
            <dt>円換算</dt><dd>${e.fee > 0 ? (currency==='TWD' ? `約 ¥${jpy}（TWD ${twd} × ${RATE}）` : `原価 TWD ${twd}（¥${jpy} ÷ ${RATE}）`) : '不要'}</dd>
            ${e.gtd ? `<dt>GTD</dt><dd>TWD ${e.gtd}</dd>` : ''}
            <dt>ブラインド</dt><dd>${structure.desc}</dd>
            ${e.note ? `<dt>メモ</dt><dd>${e.note}</dd>` : ''}
          </dl>
        </div>
      </div>
    `;
    const head = row.querySelector('.row-head');
    head.addEventListener('click', (ev)=>{
      if(ev.target.closest('.star-btn')) return;
      const wasOpen = row.classList.contains('open');
      document.querySelectorAll('.row.open').forEach(r=>r.classList.remove('open'));
      if(!wasOpen) row.classList.add('open');
    });
    row.querySelector('.star-btn').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      toggleFavorite(e.key);
    });
    listEl.appendChild(row);
  });
}

function makeMultiFilterRow(container, options, selectedSet){
  container.innerHTML = '';
  const [allVal, allLabel] = options[0];
  options.forEach(([val,label])=>{
    const btn = document.createElement('button');
    btn.className = 'chip-btn';
    btn.textContent = label;
    btn.dataset.val = val;
    container.appendChild(btn);
    btn.addEventListener('click', ()=>{
      if(val === allVal){
        selectedSet.clear();
      }else{
        if(selectedSet.has(val)) selectedSet.delete(val);
        else selectedSet.add(val);
      }
      refreshChips();
      render();
    });
  });
  function refreshChips(){
    container.querySelectorAll('.chip-btn').forEach(btn=>{
      const v = btn.dataset.val;
      const isActive = v === allVal ? selectedSet.size===0 : selectedSet.has(v);
      btn.classList.toggle('active', isActive);
    });
  }
  refreshChips();
}

makeMultiFilterRow(filtersTypeEl,
  [['ALL','すべて'],['NLH','NLH'],['PLO','PLO'],['MIX','MIX'],['OTHER','その他']],
  selectedTypes);

makeMultiFilterRow(filtersTierEl,
  [['ALL','すべて'],['MIN','MIN ~15K'],['MID','MID 15–50K'],['HR','HR 50–150K'],['SHR','SHR 150K~']],
  selectedTiers);

makeMultiFilterRow(filtersDurationEl,
  [['ALL','すべて'],['MULTI','2Days+ のみ'],['SINGLE','単日のみ']],
  selectedDurations);

favLoaded = true;
render();
loadFavorites();
</script>
</body>
</html>
