<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APT Championship Taipei 2026 Schedule</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding-bottom: 30px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
    }

    h1 { font-size: 1.1rem; color: #fff; font-weight: 700; margin-bottom: 8px; text-align: center; }

    /* 絞り込みフィルター */
    .filter-group {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-btn {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--accent-red);
      color: #fff;
      border-color: var(--accent-red);
      font-weight: bold;
    }

    .container { padding: 12px; max-width: 600px; margin: 0 auto; }

    /* トナメカード */
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .card-header {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      cursor: pointer;
    }
    .event-title-area { flex: 1; padding-right: 8px; }
    .event-number { font-size: 0.75rem; color: var(--accent-gold); font-weight: bold; margin-bottom: 2px; }
    .event-name { font-size: 0.95rem; font-weight: 600; line-height: 1.3; color: #fff; }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .meta-item { display: flex; align-items: center; gap: 4px; }
    .meta-item strong { color: var(--text-main); }
    .buyin-badge { color: #4ade80; font-weight: bold; }

    .fav-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: #475569;
      cursor: pointer;
      padding: 0 4px;
    }
    .fav-btn.active { color: var(--accent-gold); }

    /* 詳細展開（▼タブ） */
    .card-details {
      display: none;
      padding: 12px;
      background: #0f172a;
      border-top: 1px solid var(--border-color);
      font-size: 0.82rem;
    }
    .card-details.open { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .detail-box {
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
    }
    .detail-label { color: var(--text-muted); font-size: 0.7rem; margin-bottom: 2px; }
    .detail-val { font-weight: 600; color: #f1f5f9; }

    .notes {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
      background: #1e293b;
      padding: 8px;
      border-radius: 6px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<header>
  <h1>APT Championship Taipei 2026</h1>
  <div class="filter-group" id="dateFilter">
    <button class="filter-btn active" data-date="all">すべて</button>
    <button class="filter-btn" data-date="fav">お気に入り★</button>
    <button class="filter-btn" data-date="2026-11-13">11/13(金)</button>
    <button class="filter-btn" data-date="2026-11-14">11/14(土)</button>
    <button class="filter-btn" data-date="2026-11-15">11/15(日)</button>
    <button class="filter-btn" data-date="2026-11-16">11/16(月)</button>
    <button class="filter-btn" data-date="2026-11-23">11/23(月)</button>
  </div>
</header>

<div class="container" id="eventList"></div>

<script>
// --- イベントデータサンプル構造 ---
// 各Flight(Day1A, Day1B)は1つのトナメとして個別に定義します。
const events = [
  {
    id: "1001-A",
    num: "#1001 [Event 1]",
    name: "National Cup Championship - Flight A",
    date: "2026-11-13",
    buyin: "TWD 16,000",
    startTime: "11:00",
    regClose: "18:20", // レイト時間（カード表面に表示）
    stack: "100,000",
    lateBB: "25 BB", // レイト締め切り時のスタック量
    levelDur: "30分", // ブラインド時間
    structure: "Day1: 14レベル通過 / Day2: 11/15 11:00〜",
    gtd: "TWD 20,000,000"
  },
  {
    id: "1001-B",
    num: "#1001 [Event 1]",
    name: "National Cup Championship - Turbo Flight B",
    date: "2026-11-13",
    buyin: "TWD 16,000",
    startTime: "18:00",
    regClose: "22:45",
    stack: "100,000",
    lateBB: "20 BB",
    levelDur: "15分",
    structure: "Day1: 14レベル通過 / Day2: 11/15 11:00〜",
    gtd: "TWD 20,000,000"
  },
  {
    id: "1001-C",
    num: "#1001 [Event 1]",
    name: "National Cup Championship - Flight C",
    date: "2026-11-14",
    buyin: "TWD 16,000",
    startTime: "11:00",
    regClose: "18:20",
    stack: "100,000",
    lateBB: "25 BB",
    levelDur: "30分",
    structure: "Day1: 14レベル通過 / Day2: 11/15 11:00〜",
    gtd: "TWD 20,000,000"
  },
  {
    id: "1003-A",
    num: "#1003 [Event 3]",
    name: "Ultra Stack Championship - Flight A",
    date: "2026-11-16",
    buyin: "TWD 25,000",
    startTime: "11:00",
    regClose: "16:30",
    stack: "200,000",
    lateBB: "33.3 BB",
    levelDur: "30分",
    structure: "Day1: 16レベルプレイ / Day2: 11/17 11:00〜",
    gtd: "TWD 25,000,000"
  },
  {
    id: "1014-A",
    num: "#1014 [Event 14]",
    name: "APT Main Event Freezeout - Flight A",
    date: "2026-11-23",
    buyin: "USD 10,000",
    startTime: "11:00",
    regClose: "18:40",
    stack: "250,000",
    lateBB: "50 BB",
    levelDur: "60分",
    structure: "Day1: 10レベル消化 / Day2: 11/25〜",
    gtd: "USD 5,000,000"
  }
];

let favorites = JSON.parse(localStorage.getItem('apt_favs') || '[]');
let currentFilter = 'all';

function renderEvents() {
  const container = document.getElementById('eventList');
  container.innerHTML = '';

  const filtered = events.filter(e => {
    if (currentFilter === 'fav') return favorites.includes(e.id);
    if (currentFilter !== 'all') return e.date === currentFilter;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:30px; color:#64748b;">該当するイベントがありません</div>';
    return;
  }

  filtered.forEach(e => {
    const isFav = favorites.includes(e.id);
    const card = document.createElement('div');
    card.className = 'event-card';

    card.innerHTML = `
      <div class="card-header" onclick="toggleDetail('${e.id}')">
        <div class="event-title-area">
          <div class="event-number">${e.num}</div>
          <div class="event-name">${e.name}</div>
          <div class="card-meta">
            <span class="buyin-badge">${e.buyin}</span>
            <span class="meta-item">開始: <strong>${e.startTime}</strong></span>
            <span class="meta-item" style="color:#ef4444;">レイト: <strong>${e.regClose}</strong></span>
          </div>
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${e.id}')">
          ${isFav ? '★' : '☆'}
        </button>
      </div>

      <div class="card-details" id="detail-${e.id}">
        <div class="detail-grid">
          <div class="detail-box">
            <div class="detail-label">Starting Stack</div>
            <div class="detail-val">${e.stack} <span style="font-size:0.7rem; color:#f59e0b;">(レイト時${e.lateBB})</span></div>
          </div>
          <div class="detail-box">
            <div class="detail-label">ブラインド時間</div>
            <div class="detail-val">${e.levelDur}</div>
          </div>
        </div>
        ${e.gtd ? `<div class="notes" style="color:#4ade80; font-weight:bold; margin-bottom:6px;">GTD: ${e.gtd}</div>` : ''}
        <div class="notes">
          <strong>進行日程・構造:</strong><br>${e.structure}
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleDetail(id) {
  const el = document.getElementById(`detail-${id}`);
  if (el) el.classList.toggle('open');
}

function toggleFav(event, id) {
  event.stopPropagation(); // 詳細タブが開くのを防止
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
  } else {
    favorites.push(id);
  }
  localStorage.setItem('apt_favs', JSON.stringify(favorites));
  renderEvents();
}

// フィルターボタン切り替え
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.date;
    renderEvents();
  });
});

// 初期描画
renderEvents();
</script>
</body>
</html>
